#cloud-config
package_update: true
package_upgrade: true
packages:
  - curl
  - git
  - ca-certificates
  - jq

write_files:
  - path: /etc/motd
    permissions: "0644"
    content: |
      Hermes MVP bootstrap completed.
      Next steps:
        1) Copy deploy/deploy-hermes-mvp.sh to this server
        2) chmod +x deploy-hermes-mvp.sh
        3) ./deploy-hermes-mvp.sh
  - path: /usr/local/bin/install-hermes.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      tmp="$(mktemp)"
      curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o "$tmp"
      bash "$tmp"
      rm -f "$tmp"

runcmd:
  - /usr/local/bin/install-hermes.sh
  - echo 'export PATH="$HOME/.local/bin:$PATH"' >> /root/.bashrc
