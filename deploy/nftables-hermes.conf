#!/usr/sbin/nft -f
# Baseline host firewall — closes README open item #3 ("host firewall not
# configured"). Deliberately allows ONLY 22 (SSH) and 443 (Caddy) — no 80,
# since dynv6 DNS-01 never needs an HTTP-01 fallback.
#
# NOT auto-applied by 04-enable-api-server.sh. Firewall changes over an SSH
# session that can lock you out of the box are exactly the kind of action
# worth doing by hand, deliberately, with a second terminal open to verify
# recovery before trusting it. See the "apply" instructions the deploy
# script prints — same three-step shape every time: syntax-check, apply,
# verify a FRESH connection from a second terminal before closing this one.
#
# THREE RULES HERE ARE SECURITY BOUNDARIES, NOT TUNING. Removing any of them
# silently reopens something that was closed deliberately:
#
#   1. input `policy drop` is what keeps the tutor sandbox off the family
#      API-server ports. It protects the sandbox boundary, not just the host.
#   2. the sandbox-subnet drop in `input` stops a student kernel reaching ANY
#      host service, including SSH.
#   3. the dashboard rule in `output` stops one family member's agent opening
#      another member's web dashboard over shared loopback.
#
# Each is verified by a check in context/spec/SPEC-tutor-isolation.md or
# context/spec/SPEC-profile-isolation.md. Re-run them after editing this file.

flush ruleset

# Podman allocates sandbox bridges from 10.89.0.0/16. Matching the SUBNET
# rather than the interface name (podman1, podman2, …) is deliberate: those
# names are assigned dynamically and change when a network is recreated, which
# would leave interface-named rules silently matching nothing.
define SANDBOX_NET = 10.89.0.0/16

# Per-member Hermes web dashboards. Admin surfaces — they manage config, API
# keys and sessions — so only root and caddy may reach them.
define DASHBOARD_PORTS = 9121-9124
define CADDY_UID = 999

table inet filter {
	chain input {
		type filter hook input priority 0; policy drop;

		# Return traffic first, so host-initiated connections into the
		# sandbox (e.g. Caddy reverse-proxying it) still work. The sandbox
		# drop below must come AFTER this or those replies are killed.
		ct state established,related accept
		ct state invalid drop

		# The sandbox may not open a connection to ANY host service —
		# not the family API servers, not SearXNG, not SSH. Verified by
		# SPEC-tutor-isolation VC-3.
		ip saddr $SANDBOX_NET drop

		iif lo accept
		ip protocol icmp accept
		ip6 nexthdr icmpv6 accept

		tcp dport 22 accept
		tcp dport 443 accept
	}

	chain forward {
		type filter hook forward priority 0; policy drop;

		# Sandbox egress: the orchestrator needs the inference endpoint.
		# Pod members share a netns, so this also grants the student kernel
		# internet access — a consequence recorded in ADR-013, not an
		# oversight.
		ip saddr $SANDBOX_NET accept
		ip daddr $SANDBOX_NET ct state established,related accept
	}

	chain output {
		type filter hook output priority 0; policy accept;

		# Loopback is shared by all four member gateways — demonstrated,
		# see SPEC-tutor-isolation VC-3. Without this rule any member's
		# agent can open any other member's dashboard with no credential
		# (measured: HTTP 200). Basic auth at Caddy does NOT cover this
		# path; it only guards the public door.
		ip daddr 127.0.0.1 tcp dport $DASHBOARD_PORTS meta skuid != { 0, $CADDY_UID } drop
	}
}

table ip nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;

		# Masquerade sandbox egress. Destination-based rather than
		# interface-based, for the same reason as SANDBOX_NET above.
		ip saddr $SANDBOX_NET ip daddr != $SANDBOX_NET masquerade
	}
}
